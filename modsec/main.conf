# =============== Basic ModSecurity v3 Configuration ===============
# This file is used by nginx (modsecurity_rules_file /etc/nginx/modsec/main.conf)

# Enable ModSecurity (On = blocking, DetectionOnly = log-only)
SecRuleEngine On

# Request/response inspection settings
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml

# Temporary / data storage for ModSecurity (ensure these directories exist)
SecDataDir /tmp
SecTmpDir /tmp

# Audit log settings
SecAuditEngine RelevantOnly
SecAuditLog /var/log/modsec_audit.log
SecAuditLogParts ABIFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLogStorageDir /var/log/modsec_audit/

# Default actions for requests
SecDefaultAction "phase:1,log,deny,status:403"
SecDefaultAction "phase:2,log,deny,status:403"

# OPTIONAL: Simple example rules (keep for quick testing)
# Test rule: block requests containing "testblock" in URL
# SecRule REQUEST_URI "@contains testblock" "id:900001,phase:1,deny,log,msg:'Test block rule'"

# === OWASP CRS Integration ===
# If you installed modsecurity-crs via package, these paths should exist.
# If you placed CRS in repo (modsecurity-crs/), adjust Include paths accordingly.
#
# Recommended: Install CRS on the system and use the system path:
#   /usr/share/modsecurity-crs/crs-setup.conf
#   /usr/share/modsecurity-crs/rules/*.conf

Include /usr/share/modsecurity-crs/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf

# End of file
